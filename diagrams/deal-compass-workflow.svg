<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<rect width="1200" height="900" fill="#ffffff"/>
<text x="50" y="55" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#172554">Deal Compass — Requirements to Decision Support</text>
<text x="50" y="85" font-family="Arial,sans-serif" font-size="16" fill="#475569">From investment terms to scenario analysis and founder review</text>

<g stroke="#334155" stroke-width="2" fill="none">
<line x1="600" y1="170" x2="600" y2="220"/>
<line x1="600" y1="290" x2="600" y2="340"/>
<line x1="600" y1="410" x2="600" y2="460"/>
<line x1="600" y1="530" x2="600" y2="580"/>
<line x1="600" y1="650" x2="600" y2="700"/>
</g>
<g fill="#334155">
<path d="M600 220l-8-12h16z"/><path d="M600 340l-8-12h16z"/><path d="M600 460l-8-12h16z"/><path d="M600 580l-8-12h16z"/><path d="M600 700l-8-12h16z"/>
</g>

<g font-family="Arial,sans-serif">
<rect x="280" y="110" width="640" height="60" rx="12" fill="#eff6ff" stroke="#64748b"/>
<text x="600" y="147" text-anchor="middle" font-size="19" font-weight="bold" fill="#172554">1. Founder enters investment terms</text>

<rect x="280" y="230" width="640" height="60" rx="12" fill="#ecfdf5" stroke="#64748b"/>
<text x="600" y="267" text-anchor="middle" font-size="19" font-weight="bold" fill="#172554">2. Validate inputs and structure deal data</text>

<rect x="280" y="350" width="640" height="60" rx="12" fill="#f5f3ff" stroke="#64748b"/>
<text x="600" y="387" text-anchor="middle" font-size="19" font-weight="bold" fill="#172554">3. Apply business rules and calculations</text>

<rect x="280" y="470" width="640" height="60" rx="12" fill="#f5f3ff" stroke="#64748b"/>
<text x="600" y="507" text-anchor="middle" font-size="19" font-weight="bold" fill="#172554">4. Model scenarios and deal-term implications</text>

<rect x="280" y="590" width="640" height="60" rx="12" fill="#ecfdf5" stroke="#64748b"/>
<text x="600" y="627" text-anchor="middle" font-size="19" font-weight="bold" fill="#172554">5. Present results and comparisons</text>

<rect x="280" y="710" width="640" height="60" rx="12" fill="#fffbeb" stroke="#64748b"/>
<text x="600" y="747" text-anchor="middle" font-size="19" font-weight="bold" fill="#172554">6. Founder reviews and decides next action</text>

<text x="600" y="820" text-anchor="middle" font-size="15" fill="#475569">AI can assist analysis and explanation; the founder remains responsible for interpretation and decisions.</text>
</g>
</svg>
